name: 'Frontend CI/CD with Portainer'

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write  # Allows the bot to push commits, tags, and create releases
  pull-requests: write # Required if the bot needs to create PRs

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # The folder the action should deploy.
          branch: gh-pages # The branch the action should deploy to.

